# Dedicated Codsworth window only. Global Ghostty configuration is unchanged.
# Share Tech Mono is the Fallout terminal face. JetBrains Mono fills box-drawing
# and symbols it lacks, so frames stay one cell grid instead of mixed fallbacks.
font-family = Share Tech Mono
font-family = JetBrains Mono
font-size = 15
font-feature = -calt
font-feature = -liga
adjust-cell-height = 8%
background = 0b100e
foreground = e6e9df
cursor-color = 87d787
cursor-text = 0b100e
palette = 0=#0b100e
palette = 2=#87d787
palette = 7=#e6e9df
window-width = 110
window-height = 40
title = Codsworth
